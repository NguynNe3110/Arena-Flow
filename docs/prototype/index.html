<!DOCTYPE html>
<html lang="vi" class="h-full bg-[#F0F3EE]">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ArenaFlow — Complete Interactive Prototype</title>

  <!-- Google Fonts: Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#3D6943",
            "primary-dim": "#315C38",
            "primary-container": "#BDEFBF",
            "on-primary": "#E9FFE6",
            "on-primary-container": "#2F5B36",
            "on-primary-fixed": "#1C4825",
            "secondary": "#526451",
            "secondary-container": "#D4E8D1",
            "on-secondary-container": "#445645",
            "tertiary": "#5C6330",
            "tertiary-container": "#F4FCBA",
            "background": "#F8FAF3",
            "surface": "#F8FAF3",
            "surface-container": "#EAF0E6",
            "surface-container-low": "#F1F5EC",
            "surface-container-high": "#E4EAE0",
            "surface-container-highest": "#DDE5D9",
            "surface-container-lowest": "#FFFFFF",
            "surface-variant": "#DDE5D9",
            "on-surface": "#2D342C",
            "on-surface-variant": "#596158",
            "on-background": "#2D342C",
            "outline": "#757D73",
            "outline-variant": "#ACB4A9",
            "error": "#A73B21",
            "error-container": "#FD795A",
            "on-error": "#FFF7F6"
          },
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'],
            headline: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'],
            display: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'],
            body: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif'],
            label: ['"Be Vietnam Pro"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-family: 'Material Symbols Outlined';
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .field-lines {
      background-image:
        radial-gradient(circle at 50% 100%, transparent 45px, rgba(255,255,255,0.12) 46px, rgba(255,255,255,0.12) 47px, transparent 48px),
        linear-gradient(to right, transparent calc(50% - 1px), rgba(255,255,255,0.12) calc(50% - 1px), rgba(255,255,255,0.12) calc(50% + 1px), transparent calc(50% + 1px));
    }
    .no-scrollbar::-webkit-scrollbar,
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar,
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      height: 844px;
      background-color: #F8FAF3;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #toast-host {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #14532D;
      color: #FFFFFF;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 13.5px;
      font-weight: 600;
      z-index: 9999;
      display: none;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      text-align: center;
      pointer-events: none;
      max-width: 90%;
    }
    @keyframes sheetUp {
      from { transform: translateY(24px); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>

  <!-- Core Infrastructure (Classic defer scripts for file:// compatibility) -->
  <script defer src="js/components.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/router.js"></script>

  <!-- Domain Screen Modules -->
  <script defer src="js/screens/auth-profile.js"></script>
  <script defer src="js/screens/team.js"></script>
  <script defer src="js/screens/match.js"></script>
  <script defer src="js/screens/pairing.js"></script>
  <script defer src="js/screens/mercenary.js"></script>
  <script defer src="js/screens/venue.js"></script>
  <script defer src="js/screens/chat-notif.js"></script>
  <script defer src="js/screens/reputation.js"></script>
  <script defer src="js/screens/admin.js"></script>
</head>
<body class="min-h-screen bg-[#F0F3EE] text-on-surface antialiased flex flex-col">

  <!-- Top Utility Header -->
  <header class="sticky top-0 z-40 bg-[#14532D] text-white shadow-sm border-b border-emerald-900/60">
    <div class="max-w-7xl mx-auto px-4 h-12 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <span class="material-symbols-outlined text-[#BDEFBF] text-2xl">sports_soccer</span>
        <span class="font-bold text-sm tracking-tight text-white">ArenaFlow</span>
        <span class="text-[11px] bg-white/15 text-[#BDEFBF] px-2 py-0.5 rounded-full font-medium hidden sm:inline">Prototype v2 • Full Flow</span>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span class="text-white/75 hidden sm:inline">Màn hiện tại:</span>
        <code id="demo-current-route" class="bg-black/25 text-[#BDEFBF] px-2 py-0.5 rounded font-mono font-semibold">—</code>
        <button type="button" onclick="window.ArenaUI && window.ArenaUI.toggleQuickDrawer(true)"
                class="px-2.5 py-1 rounded-lg bg-white/15 hover:bg-white/25 text-white font-semibold flex items-center gap-1 transition-colors">
          <span class="material-symbols-outlined text-[16px]">apps</span>
          <span>Màn hình</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace: 390px Mobile Frame + Right-side Demo Control Panel -->
  <div class="flex-1 max-w-6xl w-full mx-auto p-3 sm:p-6 flex flex-col lg:flex-row gap-6 items-start justify-center">

    <!-- 390px Mobile Viewport Frame -->
    <div class="mx-auto lg:mx-0 mobile-frame rounded-[36px] shadow-2xl border-[8px] border-slate-900 shrink-0">
      <!-- Top App Bar Host -->
      <div id="app-topbar-host" class="hidden shrink-0 z-20"></div>

      <!-- Active Screen Content -->
      <div id="screen-container" class="flex-1 flex flex-col overflow-y-auto no-scrollbar relative bg-[#F8FAF3]">
        <!-- Rendered by ArenaRouter -->
      </div>

      <!-- 5-Tab Bottom Navigation Bar -->
      <nav id="app-bottom-nav" class="hidden h-16 bg-white border-t border-[#E5E7EB] px-1 grid grid-cols-5 items-center shrink-0 z-20" aria-label="Điều hướng chính">
        <button type="button" data-nav-tab="MATCH-01" onclick="window.ArenaRouter.navigate('MATCH-01')"
                class="flex flex-col items-center justify-center gap-0.5 py-1 text-[11px] font-medium text-[#596158] hover:text-[#3D6943] transition-colors">
          <span class="material-symbols-outlined text-[22px]">sports_soccer</span>
          <span>Tìm kèo</span>
        </button>
        <button type="button" data-nav-tab="MERC-01" onclick="window.ArenaRouter.navigate('MERC-01')"
                class="flex flex-col items-center justify-center gap-0.5 py-1 text-[11px] font-medium text-[#596158] hover:text-[#3D6943] transition-colors">
          <span class="material-symbols-outlined text-[22px]">person_search</span>
          <span>Đá lẻ</span>
        </button>
        <button type="button" data-nav-tab="TEAM-01" onclick="window.ArenaRouter.navigate('TEAM-01')"
                class="flex flex-col items-center justify-center gap-0.5 py-1 text-[11px] font-medium text-[#596158] hover:text-[#3D6943] transition-colors">
          <span class="material-symbols-outlined text-[22px]">groups</span>
          <span>Đội bóng</span>
        </button>
        <button type="button" data-nav-tab="CHAT-01" onclick="window.ArenaRouter.navigate('CHAT-01')"
                class="relative flex flex-col items-center justify-center gap-0.5 py-1 text-[11px] font-medium text-[#596158] hover:text-[#3D6943] transition-colors">
          <span class="material-symbols-outlined text-[22px]">chat_bubble</span>
          <span id="nav-badge-chat" class="hidden absolute top-1 right-4 min-w-[16px] h-4 px-1 rounded-full bg-[#DC2626] text-white text-[10px] font-bold flex items-center justify-center leading-none"></span>
          <span>Tin nhắn</span>
        </button>
        <button type="button" data-nav-tab="PROF-01" onclick="window.ArenaRouter.navigate('PROF-01')"
                class="flex flex-col items-center justify-center gap-0.5 py-1 text-[11px] font-medium text-[#596158] hover:text-[#3D6943] transition-colors">
          <span class="material-symbols-outlined text-[22px]">person</span>
          <span>Hồ sơ</span>
        </button>
      </nav>

      <!-- Bottom Sheet Host (scoped inside mobile frame) -->
      <div id="sheet-backdrop" onclick="if(event.target===this) window.ArenaUI.closeSheet()"
           class="hidden absolute inset-0 z-40 bg-black/45 items-end justify-center">
        <div id="sheet-host" class="w-full"></div>
      </div>

      <!-- Quick Screen Jump Drawer (scoped inside mobile frame) -->
      <div id="quick-jump-drawer" onclick="if(event.target===this) window.ArenaUI.toggleQuickDrawer(false)"
           class="hidden absolute inset-0 z-50 bg-black/45 items-start justify-start">
        <div class="w-[85%] max-w-[320px] h-full bg-white shadow-2xl flex flex-col overflow-hidden">
          <div class="bg-[#14532D] text-white px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-[#BDEFBF]">apps</span>
              <span class="font-bold text-sm">Điều hướng nhanh</span>
            </div>
            <button type="button" onclick="window.ArenaUI.toggleQuickDrawer(false)" class="w-8 h-8 rounded-full hover:bg-white/15 flex items-center justify-center">
              <span class="material-symbols-outlined text-[20px]">close</span>
            </button>
          </div>
          <div class="p-3 border-b border-[#E5E7EB]">
            <input id="quick-jump-search" type="text" placeholder="Tìm mã màn hình (VD: MATCH-01, S1)..."
                   oninput="window.renderQuickJumpList(this.value)"
                   class="w-full px-3 py-2 text-xs rounded-[8px] border border-[#DDE5D9] bg-[#F8FAF3] focus:outline-none focus:border-[#3D6943]" />
          </div>
          <div id="quick-jump-list" class="flex-1 overflow-y-auto p-3 space-y-3 text-xs"></div>
        </div>
      </div>
    </div>

    <!-- Right-Side Demo Control Panel -->
    <aside id="demo-control-panel" class="w-full lg:w-96 bg-white rounded-2xl p-5 shadow-sm border border-[#DDE5D9] shrink-0 space-y-5">
      <div class="flex items-center justify-between border-b border-[#E5E7EB] pb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-[#14532D] text-white flex items-center justify-center font-bold text-xs">
            <span class="material-symbols-outlined text-[18px]">tune</span>
          </div>
          <div>
            <h2 class="font-bold text-[#111827] text-sm">Demo Control Panel</h2>
            <p class="text-[11px] text-[#596158]">Chuyển vai, thời gian, GPS &amp; lỗi giả lập</p>
          </div>
        </div>
        <button type="button" onclick="window.demoReset()"
                class="px-2.5 py-1.5 rounded-[8px] bg-[#FEF2F2] hover:bg-[#FEE2E2] text-[#DC2626] border border-[#FECACA] text-xs font-semibold flex items-center gap-1 transition-colors">
          <span class="material-symbols-outlined text-[15px]">restart_alt</span>
          <span>Reset</span>
        </button>
      </div>

      <!-- 1. Role Switcher -->
      <div>
        <label class="block text-xs font-bold text-[#2D342C] mb-2">1. Vai trò đang đóng (Role Switcher)</label>
        <div id="demo-role-buttons" class="grid grid-cols-2 gap-1.5 text-xs">
          <button type="button" data-role="Guest" onclick="window.demoSwitchRole('Guest')" class="role-btn px-2.5 py-2 rounded-[8px] border border-[#DDE5D9] text-left font-medium hover:bg-[#EAF0E6]">Khách (Guest)</button>
          <button type="button" data-role="NewUser" onclick="window.demoSwitchRole('NewUser')" class="role-btn px-2.5 py-2 rounded-[8px] border border-[#DDE5D9] text-left font-medium hover:bg-[#EAF0E6]">User mới</button>
          <button type="button" data-role="Player" onclick="window.demoSwitchRole('Player')" class="role-btn px-2.5 py-2 rounded-[8px] border border-[#DDE5D9] text-left font-medium hover:bg-[#EAF0E6]">Đá lẻ (Player)</button>
          <button type="button" data-role="Captain" onclick="window.demoSwitchRole('Captain')" class="role-btn px-2.5 py-2 rounded-[8px] border border-[#DDE5D9] text-left font-medium hover:bg-[#EAF0E6]">Đội trưởng</button>
          <button type="button" data-role="MultiCaptain" onclick="window.demoSwitchRole('MultiCaptain')" class="role-btn px-2.5 py-2 rounded-[8px] border border-[#DDE5D9] text-left font-medium hover:bg-[#EAF0E6]">Captain nhiều đội</button>
          <button type="button" data-role="Member" onclick="window.demoSwitchRole('Member')" class="role-btn px-2.5 py-2 rounded-[8px] border border-[#DDE5D9] text-left font-medium hover:bg-[#EAF0E6]">Thành viên</button>
          <button type="button" data-role="Admin" onclick="window.demoSwitchRole('Admin')" class="role-btn col-span-2 px-2.5 py-2 rounded-[8px] border border-[#DDE5D9] text-left font-medium hover:bg-[#EAF0E6]">Quản trị viên (Admin)</button>
        </div>
      </div>

      <!-- 2. Mock Clock -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="demo-mock-clock" class="text-xs font-bold text-[#2D342C]">2. Đồng hồ giả lập (Mock Clock)</label>
          <div class="flex items-center gap-1">
            <button type="button" onclick="window.demoAdvanceHours(1)" class="px-1.5 py-0.5 rounded bg-[#EAF0E6] text-[#14532D] text-[10px] font-bold hover:bg-[#DDE5D9]">+1h</button>
            <button type="button" onclick="window.demoAdvanceHours(24)" class="px-1.5 py-0.5 rounded bg-[#EAF0E6] text-[#14532D] text-[10px] font-bold hover:bg-[#DDE5D9]">+24h</button>
          </div>
        </div>
        <input id="demo-mock-clock" type="datetime-local"
               onchange="window.demoSetClock(this.value)"
               class="w-full px-3 py-2 text-xs rounded-[8px] border border-[#DDE5D9] bg-[#F8FAF3] text-[#111827] focus:outline-none focus:border-[#3D6943]" />
      </div>

      <!-- 3. GPS Toggle -->
      <div>
        <label class="block text-xs font-bold text-[#2D342C] mb-1.5">3. Trạng thái GPS</label>
        <div class="grid grid-cols-3 gap-1.5 text-xs">
          <button type="button" data-gps="granted" onclick="window.demoSetGps('granted')" class="gps-btn px-2 py-1.5 rounded-[8px] border border-[#DDE5D9] font-medium text-center">Đã cấp</button>
          <button type="button" data-gps="prompt" onclick="window.demoSetGps('prompt')" class="gps-btn px-2 py-1.5 rounded-[8px] border border-[#DDE5D9] font-medium text-center">Hỏi quyền</button>
          <button type="button" data-gps="denied" onclick="window.demoSetGps('denied')" class="gps-btn px-2 py-1.5 rounded-[8px] border border-[#DDE5D9] font-medium text-center">Từ chối</button>
        </div>

      <div>
        <label for="demo-error-sim" class="block text-xs font-bold text-[#2D342C] mb-1.5">4. Giả lập lỗi API (Error Simulator)</label>
        <select id="demo-error-sim" onchange="window.demoSetError(this.value)"
                class="w-full px-3 py-2 text-xs rounded-[8px] border border-[#DDE5D9] bg-[#F8FAF3] text-[#111827] focus:outline-none focus:border-[#3D6943]">
          <option value="none">Bình thường (Không lỗi)</option>
          <option value="403">403 — Không có quyền truy cập</option>
          <option value="404">404 — Không tìm thấy dữ liệu</option>
          <option value="409">409 — Xung đột phiên bản (PAIRING_006)</option>
          <option value="network">Network — Mất kết nối mạng</option>
        </select>
      </div>

      <!-- 5. Quick Screen Jump -->
      <div class="pt-3 border-t border-[#E5E7EB]">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-[#2D342C]">5. Nhảy nhanh màn hình</span>
          <button type="button" onclick="window.ArenaUI && window.ArenaUI.toggleQuickDrawer(true)" class="text-[11px] font-semibold text-[#3D6943] hover:underline">Xem tất cả</button>
        </div>
        <div class="flex flex-wrap gap-1.5 text-[11px]">
          <button type="button" onclick="window.ArenaRouter.navigate('APP-01')" class="px-2 py-1 rounded bg-[#EAF0E6] hover:bg-[#DDE5D9] text-[#14532D] font-semibold">APP-01</button>
          <button type="button" onclick="window.ArenaRouter.navigate('S1')" class="px-2 py-1 rounded bg-[#EAF0E6] hover:bg-[#DDE5D9] text-[#14532D] font-semibold">S1</button>
          <button type="button" onclick="window.ArenaRouter.navigate('MATCH-01')" class="px-2 py-1 rounded bg-[#EAF0E6] hover:bg-[#DDE5D9] text-[#14532D] font-semibold">MATCH-01</button>
          <button type="button" onclick="window.ArenaRouter.navigate('PAIR-01')" class="px-2 py-1 rounded bg-[#EAF0E6] hover:bg-[#DDE5D9] text-[#14532D] font-semibold">PAIR-01</button>
          <button type="button" onclick="window.ArenaRouter.navigate('MERC-01')" class="px-2 py-1 rounded bg-[#EAF0E6] hover:bg-[#DDE5D9] text-[#14532D] font-semibold">MERC-01</button>
          <button type="button" onclick="window.ArenaRouter.navigate('TEAM-01')" class="px-2 py-1 rounded bg-[#EAF0E6] hover:bg-[#DDE5D9] text-[#14532D] font-semibold">TEAM-01</button>
          <button type="button" onclick="window.ArenaRouter.navigate('VEN-01')" class="px-2 py-1 rounded bg-[#EAF0E6] hover:bg-[#DDE5D9] text-[#14532D] font-semibold">VEN-01</button>
          <button type="button" onclick="window.ArenaRouter.navigate('CHAT-01')" class="px-2 py-1 rounded bg-[#EAF0E6] hover:bg-[#DDE5D9] text-[#14532D] font-semibold">CHAT-01</button>
          <button type="button" onclick="window.ArenaRouter.navigate('NOTIF-01')" class="px-2 py-1 rounded bg-[#EAF0E6] hover:bg-[#DDE5D9] text-[#14532D] font-semibold">NOTIF-01</button>
          <button type="button" onclick="window.ArenaRouter.navigate('REP-01')" class="px-2 py-1 rounded bg-[#EAF0E6] hover:bg-[#DDE5D9] text-[#14532D] font-semibold">REP-01</button>
          <button type="button" onclick="window.ArenaRouter.navigate('ADM-01')" class="px-2 py-1 rounded bg-[#EAF0E6] hover:bg-[#DDE5D9] text-[#14532D] font-semibold">ADM-01</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Toast Host -->
  <div id="toast-host" role="status" aria-live="polite"></div>

  <!-- Demo Control Panel Glue Logic -->
  <script>
    window.demoSwitchRole = function (roleKey) {
      if (!window.ArenaStore) return;
      window.ArenaStore.switchRole(roleKey);
      if (window.ArenaUI) window.ArenaUI.toast('Đã chuyển vai: ' + roleKey, 'info');
      if (roleKey === 'Guest') {
        window.ArenaRouter.navigate('S1');
      } else if (roleKey === 'NewUser') {
        window.ArenaRouter.navigate('S4');
      } else if (roleKey === 'Admin') {
        window.ArenaRouter.navigate('ADM-01');
      } else {
        window.ArenaRouter.refresh();
      }
    };

    window.demoSetClock = function (val) {
      if (!window.ArenaStore || !val) return;
      const iso = new Date(val).toISOString();
      window.ArenaStore.setMockClock(iso);
      if (window.ArenaUI) window.ArenaUI.toast('Đã cập nhật đồng hồ giả lập', 'info');
    };

    window.demoAdvanceHours = function (hours) {
      if (!window.ArenaStore) return;
      const cur = window.ArenaStore.getMockClock();
      cur.setHours(cur.getHours() + hours);
      window.ArenaStore.setMockClock(cur.toISOString());
      if (window.ArenaUI) window.ArenaUI.toast('Đã tua thêm ' + hours + ' giờ', 'info');
    };

    window.demoSetGps = function (status) {
      if (!window.ArenaStore) return;
      window.ArenaStore.setGpsStatus(status);
      if (window.ArenaUI) window.ArenaUI.toast('GPS: ' + status, 'info');
    };

    window.demoSetError = function (errType) {
      if (!window.ArenaStore) return;
      window.ArenaStore.setSimulatedError(errType);
      if (window.ArenaRouter) window.ArenaRouter.refresh();
    };

    window.demoReset = function () {
      if (!window.ArenaStore) return;
      window.ArenaStore.reset();
      if (window.ArenaUI) window.ArenaUI.toast('Đã đặt lại toàn bộ dữ liệu mẫu!', 'success');
      if (window.ArenaRouter) window.ArenaRouter.navigate('APP-01', {}, { replace: true });
    };

    window.syncDemoPanelUI = function () {
      if (!window.ArenaStore) return;
      const roleKey = window.ArenaStore.getRoleKey();
      document.querySelectorAll('#demo-role-buttons .role-btn').forEach(function (btn) {
        const active = btn.getAttribute('data-role') === roleKey;
        btn.classList.toggle('bg-[#14532D]', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('border-[#14532D]', active);
      });

      const gps = window.ArenaStore.getGpsStatus();
      document.querySelectorAll('.gps-btn').forEach(function (btn) {
        const active = btn.getAttribute('data-gps') === gps;
        btn.classList.toggle('bg-[#3D6943]', active);
        btn.classList.toggle('text-white', active);
        btn.classList.toggle('border-[#3D6943]', active);
      });

      const clockInput = document.getElementById('demo-mock-clock');
      if (clockInput) {
        const d = window.ArenaStore.getMockClock();
        const pad = function (n) { return String(n).padStart(2, '0'); };
        clockInput.value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }

      const errSelect = document.getElementById('demo-error-sim');
      if (errSelect) {
        errSelect.value = window.ArenaStore.getSimulatedError() || 'none';
      }
    };

    window.renderQuickJumpList = function (filterText) {
      const listEl = document.getElementById('quick-jump-list');
      if (!listEl || !window.ArenaRouter) return;
      const q = String(filterText || '').trim().toLowerCase();
      const routes = window.ArenaRouter.getRoutes().filter(function (r) {
        return !q || r.id.toLowerCase().includes(q) || r.title.toLowerCase().includes(q) || r.group.toLowerCase().includes(q);
      });

      if (routes.length === 0) {
        listEl.innerHTML = '<div class="text-center text-[#596158] py-6">Chưa có màn hình phù hợp.</div>';
        return;
      }

      const groups = {};
      routes.forEach(function (r) {
        if (!groups[r.group]) groups[r.group] = [];
        groups[r.group].push(r);
      });

      listEl.innerHTML = Object.keys(groups).map(function (g) {
        const items = groups[g].map(function (r) {
          return '<button type="button" onclick="window.ArenaUI.toggleQuickDrawer(false);window.ArenaRouter.navigate(\'' + r.id + '\')" ' +
            'class="w-full px-2.5 py-2 rounded-[8px] border border-[#E5E7EB] hover:border-[#3D6943] hover:bg-[#EAF0E6]/60 flex items-center justify-between text-left transition-colors">' +
            '<span class="font-semibold text-[#111827] truncate">' + window.ArenaUI.esc(r.title) + '</span>' +
            '<code class="text-[10px] px-1.5 py-0.5 rounded bg-[#EAF0E6] text-[#14532D] font-bold shrink-0 ml-2">' + window.ArenaUI.esc(r.id) + '</code>' +
            '</button>';
        }).join('');
        return '<div><div class="text-[11px] font-bold uppercase tracking-wider text-[#596158] mb-1.5">' + window.ArenaUI.esc(g) + '</div><div class="space-y-1.5">' + items + '</div></div>';
      }).join('');
    };
  </script>
</body>
</html>
