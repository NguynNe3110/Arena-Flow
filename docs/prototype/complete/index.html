<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArenaFlow — Interactive Mobile Prototype</title>
  
  <!-- Typography: Be Vietnam Pro from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>

  <div class="layout-wrapper">
    <!-- ======================================================================
         Mobile Device Frame (Simulated Android Phone 360 - 430px)
         ====================================================================== -->
    <div class="mobile-device-frame" id="mobile-frame" data-viewport="390">
      
      <!-- Simulated Android Status Bar -->
      <div class="status-bar">
        <span id="status-clock">09:41</span>
        <div class="status-bar-notch"></div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <!-- Signal & Battery Icons -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/>
          </svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/>
          </svg>
        </div>
      </div>

      <!-- App Header Bar -->
      <header class="app-header">
        <div class="header-left">
          <button class="btn btn-ghost btn-icon" id="header-back-btn" aria-label="Quay lại" style="display: none;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <div class="header-brand" id="header-brand">
            ArenaFlow<span>.</span>
          </div>
        </div>

        <div class="header-title" id="header-title">Tìm kèo</div>

        <div class="header-right">
          <!-- Notification Bell Icon with unread badge -->
          <button class="btn btn-ghost btn-icon icon-badge-btn" id="header-notif-btn" aria-label="Thông báo" onclick="window.AppRouter.navigate('notifications')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="unread-badge-pill" id="header-notif-badge" style="display: none;">0</span>
          </button>

          <!-- User Avatar / Account Menu entry -->
          <button class="btn btn-ghost btn-icon" id="header-account-btn" aria-label="Tài khoản" onclick="window.AppRouter.navigate('account-menu')">
            <div class="avatar avatar-sm" id="header-user-avatar">
              <span>U</span>
            </div>
          </button>
        </div>
      </header>

      <!-- App Viewport (Scrollable canvas for registered views) -->
      <main class="app-viewport">
        <div class="view-canvas" id="view-canvas">
          <!-- View content injected here by AppRouter -->
        </div>
      </main>

      <!-- Bottom Navigation Bar (4 Root Tabs) -->
      <nav class="app-bottom-nav" id="app-bottom-nav">
        <button class="nav-item is-active" data-tab="matches" onclick="window.AppRouter.navigate('matches')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
          <span>Tìm kèo</span>
        </button>

        <button class="nav-item" data-tab="players" onclick="window.AppRouter.navigate('players')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Đá lẻ</span>
        </button>

        <button class="nav-item" data-tab="inbox" onclick="window.AppRouter.navigate('inbox')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Tin nhắn</span>
        </button>

        <button class="nav-item" data-tab="teams" onclick="window.AppRouter.navigate('teams')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span>Đội của tôi</span>
        </button>
      </nav>

      <!-- Home Indicator Bar -->
      <div class="home-indicator">
        <div class="home-bar"></div>
      </div>

      <!-- Modal Backdrop (Houses Bottom Sheets & Dialogs) -->
      <div class="modal-backdrop" id="modal-backdrop">
        <!-- Bottom Sheet Primitive -->
        <div class="bottom-sheet" id="bottom-sheet" style="display: none;">
          <div class="bottom-sheet-handle"></div>
          <div class="bottom-sheet-header">
            <h3 class="bottom-sheet-title" id="bottom-sheet-title">Tiêu đề</h3>
            <button class="btn btn-ghost btn-icon" onclick="window.AppRouter.closeSheet()" aria-label="Đóng">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="bottom-sheet-body" id="bottom-sheet-body">
            <!-- Sheet body content -->
          </div>
          <div class="bottom-sheet-footer" id="bottom-sheet-footer">
            <!-- Sheet actions -->
          </div>
        </div>

        <!-- Center Dialog Primitive -->
        <div class="center-dialog" id="center-dialog" style="display: none;">
          <!-- Dialog content -->
        </div>
      </div>

      <!-- Toast Feedback Notifications -->
      <div class="toast-container" id="toast-container"></div>
    </div>

    <!-- ======================================================================
         Dockable / Collapsible Demo Controller Panel
         ====================================================================== -->
    <aside class="demo-panel-container" id="demo-panel-container">
      <!-- Injected by demo-panel.js -->
    </aside>
  </div>

  <!-- Collapsed Floating Action Button for Demo Panel -->
  <button class="demo-panel-fab" id="demo-panel-fab" style="display: none;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
    <span>Demo Panel</span>
  </button>

  <!-- ES6 Application Bootstrap -->
  <script type="module">
    import { AppStore } from './js/store.js';
    import { AppRouter } from './js/router.js';
    import { AppDemoPanel } from './js/demo-panel.js';

    // Import and initialize all module views
    import { initAuthViews } from './js/views/auth.js';
    import { initTeamViews } from './js/views/team.js';
    import { initVenueViews } from './js/views/venue.js';
    import { initMatchViews } from './js/views/match.js';
    import { initPairingViews } from './js/views/pairing.js';
    import { initMercenaryViews } from './js/views/mercenary.js';
    import { initChatNotifViews } from './js/views/chat-notif.js';
    import { initReputationViews } from './js/views/reputation.js';
    import { initAdminViews } from './js/views/admin.js';

    window.addEventListener('DOMContentLoaded', () => {
      // Register all domain views
      initAuthViews(AppRouter, AppStore);
      initTeamViews(AppRouter, AppStore);
      initVenueViews(AppRouter, AppStore);
      initMatchViews(AppRouter, AppStore);
      initPairingViews(AppRouter, AppStore);
      initMercenaryViews(AppRouter, AppStore);
      initChatNotifViews(AppRouter, AppStore);
      initReputationViews(AppRouter, AppStore);
      initAdminViews(AppRouter, AppStore);

      // Initialize Router and Demo Panel
      AppRouter.init();
      AppDemoPanel.init();

      // Synchronize Header UI with Store state
      function syncHeaderUI() {
        const state = AppStore.getState();
        const currentUser = AppStore.getCurrentUser();

        // Update User Avatar
        const avatarElem = document.getElementById('header-user-avatar');
        if (avatarElem && currentUser) {
          if (currentUser.avatarUrl) {
            avatarElem.innerHTML = `<img src="${currentUser.avatarUrl}" alt="${currentUser.displayName}">`;
          } else {
            const initial = (currentUser.displayName || currentUser.phone || 'U').slice(0, 1).toUpperCase();
            avatarElem.innerHTML = `<span>${initial}</span>`;
          }
        }

        // Update Notification Unread Badge
        const unreadNotifs = state.notifications.filter(n => n.userId === state.currentUserId && !n.read);
        const badgeElem = document.getElementById('header-notif-badge');
        if (badgeElem) {
          if (unreadNotifs.length > 0) {
            badgeElem.style.display = 'flex';
            badgeElem.textContent = unreadNotifs.length > 99 ? '99+' : unreadNotifs.length;
          } else {
            badgeElem.style.display = 'none';
          }
        }
      }

      AppStore.subscribe(syncHeaderUI);
      syncHeaderUI();
    });
  </script>
</body>
</html>
